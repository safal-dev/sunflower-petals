<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTeeth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="badgeGradTeeth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" rx="40" fill="url(#bgGradTeeth)"/>

  <!-- Decorative Background Elements -->
  <circle cx="700" cy="120" r="140" fill="#10B981" opacity="0.08"/>
  <circle cx="100" cy="900" r="180" fill="#FB862A" opacity="0.06"/>

  <!-- Main Sheet Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="700" height="900" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(80, 85)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#FEF6EC"/>
    <text x="65" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#7C2D12" letter-spacing="2" text-anchor="middle">DAYDAY SERIES</text>
    
    <!-- Waterproof Vinyl Badge -->
    <rect x="142" y="0" width="160" height="28" rx="14" fill="#D1FAE5"/>
    <text x="222" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#065F46" letter-spacing="1.5" text-anchor="middle">WATERPROOF VINYL</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#0F172A" letter-spacing="-1">I Brush My Teeth</text>
    <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="15" fill="#64748B">12-Step Visual Oral Hygiene Sticker Set for Routine Mastery</text>

    <!-- Boy / Girl Variant Tag -->
    <g transform="translate(480, 45)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#badgeGradTeeth)"/>
      <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">BOY &amp; GIRL DESIGNS</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="210" x2="720" y2="210" stroke="#F1F5F9" stroke-width="2"/>

  <!-- 12 Visual Steps Grid (3 cols x 4 rows layout) -->

  <!-- STEP 1 -->
  <g transform="translate(80, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="95" cy="70" r="28" fill="#D1FAE5"/>
    <!-- Icon: Toothbrush -->
    <path d="M84 82 l20 -24 M104 58 l4 -5 M100 55 l4 -5" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Get Toothbrush</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(305, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Wet Bristles -->
    <path d="M95 52 v14 M90 60 l10 0" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Wet Bristles</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(530, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="95" cy="70" r="28" fill="#FEE2E2"/>
    <!-- Icon: Toothpaste -->
    <rect x="85" y="55" width="20" height="30" rx="5" stroke="#E11D48" stroke-width="3" fill="none"/>
    <path d="M90 55 v-6 h10 v6" stroke="#E11D48" stroke-width="2"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Apply Toothpaste</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(80, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Brush Front -->
    <path d="M82 68 h26 M82 74 h26" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Brush Front Teeth</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(305, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">5</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Brush Top -->
    <path d="M85 62 h20 M85 70 h20" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Brush Top Teeth</text>
  </g>

  <!-- STEP 6 -->
  <g transform="translate(530, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">6</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Brush Back -->
    <path d="M85 78 h20 M85 70 h20" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Brush Back Teeth</text>
  </g>

  <!-- STEP 7 -->
  <g transform="translate(80, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">7</text>
    <circle cx="95" cy="70" r="28" fill="#FEE2E2"/>
    <!-- Icon: Brush Tongue -->
    <path d="M86 70 q9 12 18 0" stroke="#E11D48" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Clean Tongue</text>
  </g>

  <!-- STEP 8 -->
  <g transform="translate(305, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">8</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Spit -->
    <path d="M88 64 q7 10 14 0" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Spit Foam</text>
  </g>

  <!-- STEP 9 -->
  <g transform="translate(530, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">9</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Swish Cup -->
    <rect x="85" y="58" width="20" height="24" rx="4" stroke="#0284C7" stroke-width="3" fill="none"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Swish &amp; Rinse Mouth</text>
  </g>

  <!-- STEP 10 -->
  <g transform="translate(80, 740)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">10</text>
    <circle cx="95" cy="70" r="28" fill="#D1FAE5"/>
    <!-- Icon: Rinse Brush -->
    <path d="M95 54 v16 M90 62 l10 0" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Rinse Brush</text>
  </g>

  <!-- STEP 11 -->
  <g transform="translate(305, 740)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">11</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Dry Mouth -->
    <rect x="83" y="55" width="24" height="30" rx="5" stroke="#D97706" stroke-width="3" fill="none"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Wipe &amp; Dry Mouth</text>
  </g>

  <!-- STEP 12 -->
  <g transform="translate(530, 740)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#10B981"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">12</text>
    <circle cx="95" cy="70" r="28" fill="#DCFCE7"/>
    <!-- Icon: Bright Sparkle Smile -->
    <path d="M85 70 q10 12 20 0" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M95 50 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z" fill="#F59E0B"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Healthy Smile!</text>
  </g>

  <!-- Footer Brand Note -->
  <g transform="translate(80, 915)">
    <text x="320" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Sunflower Petals • Proprietary Design • DayDay Routine Series</text>
  </g>
</svg>
