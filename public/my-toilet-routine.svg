<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB862A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" rx="40" fill="url(#bgGrad)"/>

  <!-- Decorative Background Elements -->
  <circle cx="700" cy="120" r="140" fill="#38BDF8" opacity="0.08"/>
  <circle cx="100" cy="900" r="180" fill="#FB862A" opacity="0.06"/>

  <!-- Main Sheet Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="700" height="900" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(80, 85)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#FEF6EC"/>
    <text x="65" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#7C2D12" letter-spacing="2" text-anchor="middle">DAYDAY SERIES</text>
    
    <!-- Waterproof Vinyl Badge -->
    <rect x="142" y="0" width="160" height="28" rx="14" fill="#E0F2FE"/>
    <text x="222" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0369A1" letter-spacing="1.5" text-anchor="middle">WATERPROOF VINYL</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#0F172A" letter-spacing="-1">My Toilet Routine</text>
    <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="15" fill="#64748B">11-Step Visual Guidance Sticker Set for Independence &amp; Confidence</text>

    <!-- Boy / Girl Variant Tag -->
    <g transform="translate(480, 45)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#badgeGrad)"/>
      <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">BOY &amp; GIRL DESIGNS</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="210" x2="720" y2="210" stroke="#F1F5F9" stroke-width="2"/>

  <!-- 11 Visual Steps Grid (3 cols x 4 rows layout) -->

  <!-- STEP 1 -->
  <g transform="translate(80, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Pants Down -->
    <path d="M85 58 h20 v24 h-20 z M80 82 h30" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Pants Down</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(305, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Toilet -->
    <path d="M82 60 h26 v12 h-26 z M86 72 v16 h18 v-16 M80 88 h30" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Sit on Toilet</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(530, 230)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="95" cy="70" r="28" fill="#FEF6EC"/>
    <!-- Icon: Relaxed/Toileting -->
    <circle cx="95" cy="65" r="14" stroke="#EA580C" stroke-width="3" fill="none"/>
    <path d="M90 78 q5 6 10 0" stroke="#EA580C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Toileting Time</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(80, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="95" cy="70" r="28" fill="#F1F5F9"/>
    <!-- Icon: Paper/Wiping -->
    <rect x="83" y="56" width="24" height="28" rx="4" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M95 56 v-8" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Wipe Clean</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(305, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">5</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Flush -->
    <path d="M85 70 a10 10 0 1 1 18 5" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M103 70 l4 5 l-6 2" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Flush Toilet</text>
  </g>

  <!-- STEP 6 -->
  <g transform="translate(530, 400)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">6</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Clothing Up -->
    <path d="M85 82 h20 v-24 h-20 z M80 58 h30" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Clothing Up</text>
  </g>

  <!-- STEP 7 -->
  <g transform="translate(80, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">7</text>
    <circle cx="95" cy="70" r="28" fill="#DCFCE7"/>
    <!-- Icon: Walk to Sink -->
    <path d="M90 56 v18 M90 74 l-6 12 M90 74 l6 12 M84 64 h12" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="50" r="5" fill="#16A34A"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Walk to Sink</text>
  </g>

  <!-- STEP 8 -->
  <g transform="translate(305, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">8</text>
    <circle cx="95" cy="70" r="28" fill="#FEE2E2"/>
    <!-- Icon: Soap -->
    <rect x="85" y="60" width="20" height="22" rx="4" stroke="#DC2626" stroke-width="3" fill="none"/>
    <path d="M95 60 v-8 h-4" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Apply Soap</text>
  </g>

  <!-- STEP 9 -->
  <g transform="translate(530, 570)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">9</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Scrub Hands -->
    <path d="M84 72 q11 -12 22 0 M86 64 q9 -10 18 0" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Scrub Hands</text>
  </g>

  <!-- STEP 10 -->
  <g transform="translate(192, 740)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">10</text>
    <circle cx="95" cy="70" r="28" fill="#E0F2FE"/>
    <!-- Icon: Rinse Water Drops -->
    <path d="M95 52 q-6 10 0 14 q6 -4 0 -14 M85 64 q-4 8 0 10 M105 64 q-4 8 0 10" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Rinse Hands</text>
  </g>

  <!-- STEP 11 -->
  <g transform="translate(418, 740)" filter="url(#subtleShadow)">
    <rect width="190" height="150" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="14" fill="#FB862A"/>
    <text x="26" y="31" font-family="system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">11</text>
    <circle cx="95" cy="70" r="28" fill="#FEF3C7"/>
    <!-- Icon: Towel / Dry Hands -->
    <rect x="83" y="55" width="24" height="30" rx="5" stroke="#D97706" stroke-width="3" fill="none"/>
    <path d="M83 67 h24" stroke="#D97706" stroke-width="2"/>
    <text x="95" y="125" font-family="system-ui" font-weight="700" font-size="13" fill="#1E293B" text-anchor="middle">Dry Hands</text>
  </g>

  <!-- Footer Brand Note -->
  <g transform="translate(80, 915)">
    <text x="320" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Sunflower Petals • Proprietary Design • DayDay Routine Series</text>
  </g>
</svg>
